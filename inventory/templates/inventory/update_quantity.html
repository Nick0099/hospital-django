<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Quantity</title>
</head>
<body>{% extends 'base.html' %}
{% block title %}Update Quantity{% endblock %}
{% block nav_inventory %}active{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="/inventory/" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h3 class="mb-4">Update — {{ item.name }}</h3>
                <p class="text-muted">Current: <strong>{{ item.quantity }} {{ item.get_unit_display }}</strong></p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">New Quantity</label>
                        <input type="number" name="quantity" value="{{ item.quantity }}" min="0" class="form-control">
                    </div>
                    <button class="btn btn-primary w-100">Update</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
