<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item</title>
</head>
<body>{% extends 'base.html' %}
{% block title %}Add Item{% endblock %}
{% block nav_inventory %}active{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="/inventory/" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h3 class="mb-4"><i class="bi bi-box-seam"></i> Add Inventory Item</h3>
                {% load crispy_forms_tags %}
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button class="btn btn-primary w-100 mt-2">Save Item</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
