<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
</head>
<body>
    {% extends 'base.html' %}
{% block title %}Book Appointment{% endblock %}
{% block nav_appointments %}active{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="/appointments/" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h3 class="mb-4"><i class="bi bi-calendar-plus"></i> Book Appointment</h3>
                {% load crispy_forms_tags %}
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button class="btn btn-primary w-100 mt-2">Book Appointment</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}</body>
</html>
