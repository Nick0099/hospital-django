<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hospital Management System{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Floating navbar wrapper — sits above page content */
        .navbar-float-wrapper {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 860px;
            z-index: 1050;
        }

        /* Glossy frosted glass pill */
        .navbar {
            background: rgba(255, 255, 255, 0.60) !important;
            backdrop-filter: blur(28px) saturate(210%) !important;
            -webkit-backdrop-filter: blur(28px) saturate(210%) !important;
            /* Top gloss highlight + subtle shadow */
            box-shadow:
                0 1.5px 0 rgba(255, 255, 255, 0.85) inset,
                0 8px 32px rgba(0, 0, 0, 0.10),
                0 1px 2px rgba(0, 0, 0, 0.06) !important;
            border: 0.5px solid rgba(255, 255, 255, 0.75) !important;
            border-radius: 18px !important;
            height: 52px;
            padding: 0 20px !important;
        }

        /* Main content area — offset so it starts below the floating bar */
        .main-content {
            min-height: 100vh;
            padding-top: 80px; /* 14px top offset + 52px bar + breathing room */
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Floating navbar -->
    <div class="navbar-float-wrapper">
        <nav class="navbar navbar-expand-md px-4">
            <a class="navbar-brand fw-bold text-dark d-flex align-items-center gap-2" href="/">
                <i class="bi bi-hospital text-primary"></i> HMS
            </a>
            <div class="ms-auto d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                    <span class="text-secondary" style="font-size: 0.875rem;">{{ user.username }}</span>
                    <a href="/logout/" class="btn btn-sm" style="border: 0.5px solid rgba(0,0,0,0.15); border-radius: 10px; font-size: 0.85rem; padding: 4px 14px;">Log out</a>
                {% else %}
                    <a href="/login/" class="btn btn-sm" style="border: 0.5px solid rgba(0,0,0,0.15); border-radius: 10px; font-size: 0.85rem; padding: 4px 14px;">Log in</a>
                {% endif %}
            </div>
        </nav>
    </div>

    <!-- Page content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
