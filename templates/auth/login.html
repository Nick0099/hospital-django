<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital</title>
</head>
<body>
    {% extends 'base.html' %}
{% block title %}Login — HMS{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4">
            <h3 class="mb-4 text-center"><i class="bi bi-hospital"></i> Hospital Login</h3>
            {% if form.errors %}
                <div class="alert alert-danger">Wrong username or password.</div>
            {% endif %}
            {% load crispy_forms_tags %}
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="btn btn-primary w-100 mt-2">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
